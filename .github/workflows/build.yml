name: CI & Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ "**" ]

jobs:
  build_debug:
    name: Build Universal GMS Debug
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: |
          set -o pipefail
          ./gradlew assembleUniversalGmsDebug --no-configuration-cache --console=plain --warning-mode summary 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== LAST 60 LINES ==="
            tail -n 60 build.log
            echo "=== ERROR MATCHES ==="
            grep -nE "(^e:|error:|Exception|FAILURE:|What went wrong:|> Task .* FAILED)" build.log | tail -n 40 || true
          fi
          exit "$EXIT_CODE"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-gms-debug
          path: app/build/outputs/apk/universalGms/debug/*.apk
          # a debug apk is only for trying the build, after a week it's just eating actions storage
          retention-days: 7
